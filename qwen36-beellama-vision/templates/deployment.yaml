---
# Runtime config shared by the llm-init downloader and the wrapper script that
# waits for it. Single source of truth is .Values.model.* (values.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-beellama-vision-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_REPO: "{{ .Values.model.target.repo }}"
  TARGET_FILE: "{{ .Values.model.target.file }}"
  MMPROJ_REPO: "{{ .Values.model.mmproj.repo }}"
  MMPROJ_FILE: "{{ .Values.model.mmproj.file }}"
  DRAFT_REPO: "{{ .Values.model.draft.repo }}"
  DRAFT_FILE: "{{ .Values.model.draft.file }}"
  MODEL_ALIAS: "{{ .Values.model.alias }}"
  CTX_SIZE: "{{ .Values.model.ctxSize }}"
  THREADS: "{{ .Values.model.threads }}"
  LLAMACPP_PORT: "8081"
  HF_HUB_CACHE: "/cache/hf/hub"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen36-chat-template
  namespace: "{{ .Release.Namespace }}"
data:
  qwen36_chat_template.jinja: |
{{ .Files.Get "files/qwen36_chat_template.jinja" | indent 4 }}
---
# Wrapper the main container execs once llm-init's sentinel appears. llm-init's
# multi-source download only auto-wires ROLE=main -> --model and
# ROLE=mmproj -> --mmproj; it has no ROLE for a speculative-decoding draft
# model, so this script resolves all three paths itself from the shared HF
# cache (by filename search, not by assuming a revision/ref layout) and execs
# llama-server with beellama's full flag set.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beellama-vision-wrapper
  namespace: "{{ .Release.Namespace }}"
data:
  beellama-vision.sh: |
    #!/bin/sh
    set -eu

    SENTINEL=${SENTINEL:-/run/llm-init/model_download_finish}
    WAIT_INTERVAL=${WAIT_INTERVAL:-5}
    WAIT_TIMEOUT=${WAIT_TIMEOUT:-3600}
    HF_HUB_CACHE=${HF_HUB_CACHE:-/cache/hf/hub}
    log() { printf '[wrapper-beellama-vision] %s\n' "$*"; }

    elapsed=0
    while [ ! -f "$SENTINEL" ]; do
        if [ "$elapsed" -ge "$WAIT_TIMEOUT" ]; then
            log "timed out after ${WAIT_TIMEOUT}s waiting for $SENTINEL"
            exit 1
        fi
        log "waiting for $SENTINEL (elapsed=${elapsed}s)"
        sleep "$WAIT_INTERVAL"
        elapsed=$((elapsed + WAIT_INTERVAL))
    done
    log "sentinel found after ${elapsed}s"

    find_cached_file() {
        # huggingface_hub cache layout: models--<org>--<repo>/snapshots/<rev>/<file>
        repo_dir="$HF_HUB_CACHE/models--$(echo "$1" | sed 's#/#--#')"
        found=$(find "$repo_dir/snapshots" -name "$2" 2>/dev/null | head -1)
        if [ -z "$found" ]; then
            log "ERROR: could not locate $2 under $repo_dir/snapshots"
            exit 1
        fi
        echo "$found"
    }

    TARGET_PATH=$(find_cached_file "$TARGET_REPO" "$TARGET_FILE")
    MMPROJ_PATH=$(find_cached_file "$MMPROJ_REPO" "$MMPROJ_FILE")
    DRAFT_PATH=$(find_cached_file "$DRAFT_REPO" "$DRAFT_FILE")

    log "target=$TARGET_PATH"
    log "mmproj=$MMPROJ_PATH"
    log "draft=$DRAFT_PATH"

    cd /app
    exec ./llama-server \
        --model "$TARGET_PATH" \
        --spec-draft-model "$DRAFT_PATH" \
        --mmproj "$MMPROJ_PATH" \
        --spec-type dflash \
        --spec-dflash-cross-ctx 1024 \
        --alias "${MODEL_ALIAS:-qwen3.6-27b-beellama-vision}" \
        --host 0.0.0.0 --port "${LLAMACPP_PORT:-8081}" \
        -ngl 99 --spec-draft-ngl 99 \
        --ctx-size "${CTX_SIZE:-200000}" \
        --threads "${THREADS:-16}" \
        --cache-type-k turbo3 --cache-type-v turbo3 \
        --batch-size 2048 --ubatch-size 2048 \
        --parallel 1 --kv-unified \
        --flash-attn on --jinja \
        --chat-template-file /chat-template/qwen36_chat_template.jinja \
        --no-mmap --mlock \
        --temp 0.6 --top-k 20 --min-p 0.0
---
# llm-init: downloads target/mmproj/draft into the platform-shared HF cache,
# reports progress, and is the app's permanent entrance (progress dashboard
# before ready, OpenAI/Anthropic-compatible proxy to llama-server after).
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llminit
  name: llminit
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: {{ .Values.workloadReplicas.llminit }}
  selector:
    matchLabels:
      io.kompose.service: llminit
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llminit
    spec:
      initContainers:
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -c
            - mkdir -p /cache/hf/hub/.locks && chown -R 1000:1000 /cache/hf/hub /run/llm-init || true
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /cache/hf/hub
              name: hf-cache
            - mountPath: /run/llm-init
              name: run-state
      containers:
        - name: llm-init
          image: docker.io/beclab/llm-init:v1.3.1
          envFrom:
            - configMapRef:
                name: llamacpp-beellama-vision-env
          env:
            - name: ENGINE_KIND
              value: llamacpp
            - name: MODEL_NAME
              value: "{{ .Values.model.target.repo }}:UD-Q3_K_XL"
            - name: MODEL_MODE
              value: chat
            - name: MODEL_SUPPORTS
              value: "supports_function_calling,supports_parallel_function_calling,supports_tool_choice,supports_reasoning,supports_reasoning_effort"
            - name: MODEL_SOURCE_NUM
              value: "3"
            - name: MODEL_SOURCE_1
              value: "hf://{{ .Values.model.target.repo }} --include {{ .Values.model.target.file }}"
            - name: MODEL_SOURCE_1_ROLE
              value: main
            - name: MODEL_SOURCE_2
              value: "hf://{{ .Values.model.mmproj.repo }} --include {{ .Values.model.mmproj.file }}"
            - name: MODEL_SOURCE_2_ROLE
              value: mmproj
            - name: MODEL_SOURCE_3
              value: "hf://{{ .Values.model.draft.repo }} --include {{ .Values.model.draft.file }}"
            - name: MODEL_SOURCE_3_ROLE
              value: draft
            - name: HF_ENDPOINT
              value: "https://huggingface.co/"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.OLARES_USER_HUGGINGFACE_TOKEN }}"
            - name: RUN_DIR
              value: /run/llm-init
            - name: PORT
              value: "8090"
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
          ports:
            - containerPort: 8090
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: 8090
              scheme: HTTP
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: 8090
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          resources:
            limits:
              cpu: "1"
              memory: 4Gi
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - mountPath: /cache/hf/hub
              name: hf-cache
            - mountPath: /run/llm-init
              name: run-state
      dnsPolicy: ClusterFirst
      volumes:
        - name: hf-cache
          hostPath:
            path: /olares/rootfs/Common/huggingface
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: /olares/rootfs/Common/huggingface/llm-init-run/{{ .Release.Name }}
            type: DirectoryOrCreate
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llminit
  name: llminit
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: llminit
      port: 8090
      targetPort: 8090
  selector:
    io.kompose.service: llminit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacppqwen36beellamavisionone
  name: llamacppqwen36beellamavisionone
  namespace: "{{ .Release.Namespace }}"
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: {{ .Values.workloadReplicas.llamacppqwen36beellamavisionone }}
  selector:
    matchLabels:
      io.kompose.service: llamacppqwen36beellamavisionone
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacppqwen36beellamavisionone
    spec:
      containers:
        - name: beellama-vision-server
          image: "docker.io/aamsellem/beellama-cpp:0.1.3-rc1"
          command: ["/bin/sh", "/llm-init/wrappers/beellama-vision.sh"]
          envFrom:
            - configMapRef:
                name: llamacpp-beellama-vision-env
          env:
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "30000m"
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 720
          resources:
            limits:
              cpu: "16"
              memory: 40Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: 4000m
              memory: 24Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: /cache/hf/hub
              name: hf-cache
              readOnly: true
            - mountPath: /run/llm-init
              name: run-state
              readOnly: true
            - mountPath: /llm-init/wrappers
              name: wrapper
              readOnly: true
            - mountPath: "/chat-template"
              name: chat-template
              readOnly: true
      volumes:
        - name: hf-cache
          hostPath:
            path: /olares/rootfs/Common/huggingface
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: /olares/rootfs/Common/huggingface/llm-init-run/{{ .Release.Name }}
            type: DirectoryOrCreate
        - name: wrapper
          configMap:
            name: beellama-vision-wrapper
            defaultMode: 365
        - name: chat-template
          configMap:
            name: qwen36-chat-template
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: llamacppqwen36beellamavisionone
  # Named "llamacpp" (not the app name) because llm-init derives the backend
  # URL as http://<ENGINE_KIND>:8081 with no override (ENGINE_URL was removed
  # upstream) -- the Service name must match ENGINE_KIND literally.
  name: llamacpp
  namespace: "{{ .Release.Namespace }}"
spec:
  ports:
    - name: "beellama-vision"
      port: 8081
      targetPort: 8081
  selector:
    io.kompose.service: llamacppqwen36beellamavisionone
