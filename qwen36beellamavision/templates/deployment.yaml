---
# Runtime config shared by the llm-init downloader and the wrapper script that
# waits for it. Single source of truth is .Values.model.* (values.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: llamacpp-beellama-vision-env
  namespace: "{{ .Release.Namespace }}"
data:
  TARGET_REPO: "{{ .Values.model.target.repo }}"
  TARGET_FILE: "{{ .Values.model.target.file }}"
  MMPROJ_REPO: "{{ .Values.model.mmproj.repo }}"
  MMPROJ_FILE: "{{ .Values.model.mmproj.file }}"
  DRAFT_REPO: "{{ .Values.model.draft.repo }}"
  DRAFT_FILE: "{{ .Values.model.draft.file }}"
  MODEL_ALIAS: "{{ .Values.model.alias }}"
  CTX_SIZE: "{{ .Values.model.ctxSize }}"
  THREADS: "{{ .Values.model.threads }}"
  LLAMACPP_PORT: "8081"
  HF_HUB_CACHE: "/cache/hf/hub"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen36-chat-template
  namespace: "{{ .Release.Namespace }}"
data:
  qwen36_chat_template.jinja: |
{{ .Files.Get "files/qwen36_chat_template.jinja" | indent 4 }}
---
# Wrapper the main container execs once llm-init's sentinel appears. llm-init's
# multi-source download only auto-wires ROLE=main -> --model and
# ROLE=mmproj -> --mmproj; it has no ROLE for a speculative-decoding draft
# model, so this script resolves all three paths itself from the shared HF
# cache (by filename search, not by assuming a revision/ref layout) and execs
# llama-server with beellama's full flag set.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beellama-vision-wrapper
  namespace: "{{ .Release.Namespace }}"
data:
    beellama-vision.sh: |
        #!/bin/sh
        set -eu

        HF_HUB_CACHE=${HF_HUB_CACHE:-/cache/hf/hub}
        log() { printf '[wrapper-beellama-vision] %s\n' "$*"; }

        find_cached_file() {
            # huggingface_hub cache layout: models--<org>--<repo>/snapshots/<rev>/<file>
            repo_dir="$HF_HUB_CACHE/models--$(echo "$1" | sed 's#/#--#')"
            found=$(find "$repo_dir/snapshots" -name "$2" 2>/dev/null | head -1)
            if [ -z "$found" ]; then
                log "ERROR: could not locate $2 under $repo_dir/snapshots"
                exit 1
            fi
            echo "$found"
        }

        TARGET_PATH=$(find_cached_file "$TARGET_REPO" "$TARGET_FILE")
        MMPROJ_PATH=$(find_cached_file "$MMPROJ_REPO" "$MMPROJ_FILE")
        DRAFT_PATH=$(find_cached_file "$DRAFT_REPO" "$DRAFT_FILE")

        log "target=$TARGET_PATH"
        log "mmproj=$MMPROJ_PATH"
        log "draft=$DRAFT_PATH"

        cd /app
        exec ./llama-server \
            --model "$TARGET_PATH" \
            --spec-draft-model "$DRAFT_PATH" \
            --mmproj "$MMPROJ_PATH" \
            --spec-type dflash \
            --spec-dflash-cross-ctx 1024 \
            --alias "${MODEL_ALIAS:-qwen3.6-27b-beellama-vision}" \
            --host 0.0.0.0 --port "${LLAMACPP_PORT:-8081}" \
            -ngl 99 --spec-draft-ngl 99 \
            --ctx-size "${CTX_SIZE:-200000}" \
            --threads "${THREADS:-16}" \
            --cache-type-k turbo3 --cache-type-v turbo3 \
            --batch-size 2048 --ubatch-size 2048 \
            --parallel 1 --kv-unified \
            --flash-attn on --jinja \
            --chat-template-file /chat-template/qwen36_chat_template.jinja \
            --no-mmap --mlock \
            --metrics \
            --temp 0.6 --top-k 20 --min-p 0.0
---
# llm-init: downloads target/mmproj/draft into the platform-shared HF cache,
# reports progress, and is the app's permanent entrance (progress dashboard
# before ready, OpenAI/Anthropic-compatible proxy to llama-server after).
# Runs on default-scheduler with no GPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llm-init
  name: llminit
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: {{ .Values.workloads.llminit.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llm-init
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llm-init
        app.bytetrade.io/shared-entrance: "true"
        io.bytetrade.app: "true"
        applications.app.bytetrade.io/name: "{{ .Release.Name }}"
        applications.app.bytetrade.io/raw-app-name: "{{ .Release.Name }}"
    spec:
      initContainers:
        - name: init-chown
          image: docker.io/beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -c
            - mkdir -p /cache/hf/hub/.locks && chown -R 1000:1000 /cache/hf/hub /run/llm-init || true
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /cache/hf/hub
              name: hf-cache
            - mountPath: /run/llm-init
              name: run-state
      containers:
        - name: llm-init
          image: docker.io/beclab/llm-init:v1.3.1
          envFrom:
            - configMapRef:
                name: llamacpp-beellama-vision-env
          env:
            - name: ENGINE_KIND
              value: llamacpp
            - name: MODEL_NAME
              value: "{{ .Values.model.target.repo }}:UD-Q3_K_XL"
            - name: MODEL_MODE
              value: chat
            - name: MODEL_SUPPORTS
              value: "supports_reasoning,supports_reasoning_effort,supports_function_calling,supports_parallel_function_calling,supports_tool_choice,supports_vision"
            - name: MODEL_SOURCE
              value: "hf://{{ .Values.model.target.repo }} --include {{ .Values.model.target.file }},hf://{{ .Values.model.mmproj.repo }} --include {{ .Values.model.mmproj.file }},hf://{{ .Values.model.draft.repo }} --include {{ .Values.model.draft.file }}"
            - name: HF_ENDPOINT
              value: "https://huggingface.co/"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.HUGGINGFACE_TOKEN }}"
            - name: RUN_DIR
              value: /run/llm-init
            - name: PORT
              value: "8090"
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
            - name: APP_URL
              value: "{{ .Values.olaresEnv.APP_URL }}"
          ports:
            - containerPort: 8090
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: 8090
              scheme: HTTP
            failureThreshold: 3
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: 8090
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 200m
              memory: 256Mi
          volumeMounts:
            - mountPath: /cache/hf/hub
              name: hf-cache
            - mountPath: /run/llm-init
              name: run-state
      volumes:
        - name: hf-cache
          hostPath:
            path: /olares/rootfs/Common/huggingface
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: /olares/rootfs/Common/huggingface/llm-init-run/{{ .Release.Name }}
            type: DirectoryOrCreate
      restartPolicy: Always
      schedulerName: default-scheduler
---
# BeeLlama GPU server: reads models from the shared HF cache populated by llm-init,
# then execs llama-server with DFlash speculative decoding + vision projector.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: llamacpp
  name: "{{ .Chart.Name }}"
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: {{ .Values.workloads.qwen36beellamavision.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llamacpp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llamacpp
        io.bytetrade.app: "true"
        applications.app.bytetrade.io/name: "{{ .Release.Name }}"
        applications.app.bytetrade.io/raw-app-name: "{{ .Release.Name }}"
    spec:
      containers:
        - name: llamacpp
          image: "docker.io/aamsellem/beellama-cpp:0.1.3-rc1"
          command: ["/bin/sh", "/llm-init/wrappers/beellama-vision.sh"]
          envFrom:
            - configMapRef:
                name: llamacpp-beellama-vision-env
          env:
            - name: ENGINE_KIND
              value: llamacpp
            - name: MODEL_NAME
              value: "{{ .Values.model.target.repo }}:UD-Q3_K_XL"
            - name: GPU_TYPE
              value: nvidia
            - name: HF_ENDPOINT
              value: "https://huggingface.co/"
            - name: HF_TOKEN
              value: "{{ .Values.olaresEnv.HUGGINGFACE_TOKEN }}"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
            - name: CUDA_DEVICE_MEMORY_LIMIT_0
              value: "30000m"
            - name: WAIT_TIMEOUT
              value: "3600"
          ports:
            - containerPort: 8081
              name: llamacpp
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 600
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 720
          resources:
            limits:
              cpu: "6"
              memory: 30Gi
              nvidia.com/gpu: "1"
              nvidia.com/gpumem: "23552"
            requests:
              cpu: 200m
              memory: 21Gi
              nvidia.com/gpu: "1"
              nvidia.com/gpumem: "23552"
          volumeMounts:
            - mountPath: /cache/hf/hub
              name: hf-cache
              readOnly: true
            - mountPath: /run/llm-init
              name: run-state
              readOnly: true
            - mountPath: /llm-init/wrappers
              name: wrapper
              readOnly: true
            - mountPath: "/chat-template"
              name: chat-template
              readOnly: true
      volumes:
        - name: hf-cache
          hostPath:
            path: /olares/rootfs/Common/huggingface
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: /olares/rootfs/Common/huggingface/llm-init-run/{{ .Release.Name }}
            type: DirectoryOrCreate
        - name: wrapper
          configMap:
            name: beellama-vision-wrapper
            defaultMode: 365
        - name: chat-template
          configMap:
            name: qwen36-chat-template
      restartPolicy: Always
      runtimeClassName: nvidia
      schedulerName: hami-scheduler
---
# Entrance service: OlaresManifest entrances[].host resolves this name — without
# it the app never leaves `initializing` (entrance readiness probes this Service).
apiVersion: v1
kind: Service
metadata:
  name: llminit
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
---
# Compose service-name alias: llm-init ENGINE_KIND=llamacpp derives the engine
# proxy target http://llamacpp:$LLAMACPP_PORT, so the GPU server must be
# reachable under exactly this name.
apiVersion: v1
kind: Service
metadata:
  name: llamacpp
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: llamacpp
spec:
  selector:
    io.kompose.service: llamacpp
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  type: ClusterIP
