admin: ""
bfl:
  username: ""
workloads:
  llminit:
    replicaCount: 1
  qwen36beellamavision:
    replicaCount: 1
userspace:
  appData: ""
  appCache: ""
  userData: ""
olaresEnv: {}
model:
  target:
    repo: unsloth/Qwen3.6-27B-GGUF
    file: Qwen3.6-27B-UD-Q3_K_XL.gguf
  mmproj:
    repo: unsloth/Qwen3.6-27B-GGUF
    file: mmproj-F16.gguf
  draft:
    repo: spiritbuun/Qwen3.6-27B-DFlash-GGUF
    file: dflash-draft-3.6-q8_0.gguf
  # No `alias` key: the engine's --alias is pinned to MODEL_NAME in the
  # ConfigMap (see templates/deployment.yaml) because llm-init's readiness gate
  # matches on it. A free-form alias here would silently disable the API.
  ctxSize: "200000"
  threads: "16"
  # Unload model + KV cache from VRAM after this many idle seconds (llama.cpp
  # --sleep-idle-seconds). /health, /props and /v1/models are bypass routes, so
  # probes and llm-init polling do not reset the timer; the first completion
  # request transparently reloads the model. -1 disables.
  sleepIdleSeconds: "900"
