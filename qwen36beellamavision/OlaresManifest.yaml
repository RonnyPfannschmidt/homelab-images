  name: qwen36beellamavision
  # icon filename intentionally keeps the old app id — it points at the existing
  # asset on aamsellem's external host, which is not renamed by this chart rename.
  icon: https://orales-one-market.aamsellem.workers.dev/icons/llamacppqwen36beellamavisionone.png
  description: "Qwen3.6 27B vision-capable — 106 t/s @ 200K via BeeLlama.cpp + mmproj F16 + DFlash + turbo3 KV"
  title: Qwen36 27B BeeLlama Vision One
  version: 1.2.4
  categories:
    - Vision
    - AI Agents
  bento:
    family: qwen
    size_label: "27B"
    badge: vision
    hero:
      value: "106 t/s"
      label: "speed + vision"
    specs:
      - { label: "context", value: "200K" }
      - { label: "vram", value: "22 GB" }
    capabilities:
      tool_calling: true
      vision:       true
      audio:        false
      mtp:          { enabled: true, accept: 24 }
    stack: "BeeLlama · DFlash · mmproj BF16"
# The only entrance: llm-init's download-progress dashboard, opened from the
# Olares desktop with a browser session. `authLevel: internal` means it 302s to
# Authelia for any request without a session, so it is NOT an API surface —
# other apps reach the model over in-cluster Service DNS instead
# (http://llminit.qwen36beellamavision-shared:8090/v1), which is what
# options.shared below enables.
entrances:
  - name: qwen36beellamavision
    port: 8090
    host: llminit
    title: Qwen36 27B BeeLlama Vision
    icon: https://orales-one-market.aamsellem.workers.dev/icons/llamacppqwen36beellamavisionone.png
    openMethod: window
    authLevel: internal
spec:
  # Required by lint whenever options.shared is true: a shared app serves every
  # user on the cluster, so only an admin may install it.
  onlyAdmin: true
  versionName: 1.2.4
  upgradeDescription: |
    v1.2.2: fix the OpenAI API never coming up. llm-init only enables its `/v1/*` data plane once it finds a model advertised under `MODEL_NAME` in the engine's `/v1/models`; this chart passed `--alias qwen3.6-27b-beellama-vision` while `MODEL_NAME` was `unsloth/Qwen3.6-27B-GGUF:UD-Q3_K_XL`, so the gate never matched and every API call got `503 {"code":"not_ready","message":"model not ready; data plane disabled"}` — with `engine_alive: true` and the engine serving normally on :8081 the whole time. `--alias` is now pinned to `MODEL_NAME` and the free-form `model.alias` value is gone. Pre-existing since the llm-init migration in v1.1.0; it was masked by the entrance's Authelia redirect, which failed earlier in the request path.

    v1.2.1: drop the `sharedEntrances` block and `sharedentrances-api` Service added in v1.2.0 — app-service ignores them (the install event logs `SharedEntrances: nil`); shared apps are consumed over in-cluster Service DNS, not over a URL. Restores the entrance name to the appid, so its URL goes back to what it was before v1.2.0.

    v1.2.0: make the model reachable from other apps (Open WebUI, agents). The app only had a per-user `authLevel: internal` entrance, which 302s every request to Authelia — fine for a browser, useless for a server-side connection probe. `options.shared: true` moves the release to the `qwen36beellamavision-shared` namespace and force-enables cross-namespace access, so consumers can reach the engine at `http://llminit.qwen36beellamavision-shared:8090/v1`. Requires `spec.onlyAdmin: true` (lint) and makes the install admin-only. Uninstall + install rather than an in-place upgrade; the GGUF cache is on a namespace-independent hostPath, so nothing re-downloads.

    v1.1.0: migrate model downloading to the platform's `llm-init` sidecar (`docker.io/beclab/llm-init:v1.3.1`), replacing the hand-rolled curl script that used to run inside the same container as the GPU server process.

    Root cause this fixes: every time the server container crashed — most often the pre-existing HAMi-core UINT64 OOM underflow documented below — Kubernetes recreated the container from scratch, and the old curl-based downloader had no way to tell that the target/draft/mmproj GGUFs already existed under `/olares/share/ai/model`, so all ~17 GB were fetched again from HuggingFace before the server could even start. That habit was mistaken for "the container image isn't cached" — it wasn't the image (kubelet always found it `already present on machine`), it was the multi-gigabyte model weights.

    New layout: a second Deployment (`llminit`, no GPU) owns the download entirely, using `MODEL_SOURCE_NUM`/`MODEL_SOURCE_<i>`/`MODEL_SOURCE_<i>_ROLE` (`main` for the target GGUF, `mmproj` for the vision projector, and a `draft` tag for the DFlash drafter — `llm-init` only special-cases `main`/`mmproj`, so the drafter file is resolved by filename search in the shared HF cache by the server's own wrapper script instead of an auto-wired flag) into the platform-shared, standard-layout HuggingFace cache at `/olares/rootfs/Common/huggingface` — the same directory other `llm-init`-based apps read from, so identical files are never fetched twice. `llm-init` writes a sentinel file once all three downloads verify; the server Deployment's container just waits on that sentinel (via a wrapper script instead of the old embedded bash+curl block), then execs `llama-server` with the resolved paths. A server crash now only restarts the server — the cache and sentinel live in hostPath storage untouched by the crash, so restart is immediate with no re-download.

    The app's entrance now points at `llm-init`'s own port (8090) rather than directly at the llama-server port (8000): `llm-init` doubles as an OpenAI/Anthropic-compatible reverse proxy in front of the engine, and shows its own progress dashboard while the download is running, so first-launch progress is now visible in the Olares UI instead of being silent until the curl script finished.

    This does not change the underlying `CUDA_DEVICE_MEMORY_LIMIT_0=30000m` HAMi-core workaround from v1.0.1/v1.0.2 below — that GPU crash can still happen — but a crash restart is now cheap instead of re-triggering a 17 GB download.

    v1.0.2: upgrade to BeeLlama HEAD commit `75ae2a6af` (built as `aamsellem/beellama-cpp:0.1.3-rc1`) — includes Anbeeld's fix for GPU ring crash in `llm_build_dflash_kv_update` at long context prefill (issue #16, merged 2026-05-15 17:55). This is the upstream resolution for the crash that v1.0.1 worked around via the HAMi-core memory limit bump. The original symptom on RTX 5090M sm_120 + Hermes Agent workload was a HAMi-core UINT64 underflow (`Device 0 OOM 18446744073709500456 / 25480396800`) which we now suspect was a downstream artifact of orphaned ring-buffer allocations after the underlying GPU ring crash — fixed upstream by `75ae2a6af`. Bench validated 2026-05-16 on Olares One: 105.52 t/s AVG @ 200K (10 runs, range 34.92) — perf parity with v1.0.1 (106.43 t/s, range 23.4) within noise. `system_fingerprint: b16-75ae2a6af` confirms commit. Long-context multi-turn validation (Hermes Agent at 100K+ accumulated context) is the real test — pending real-world user session.

    Keeping `CUDA_DEVICE_MEMORY_LIMIT_0=30000m` (bumped from 24300m in v1.0.1) as a safety belt until the user's next long agentic session confirms the fix holds. A future v1.0.3 will restore the strict 24300m once we have empirical proof the GPU ring fix eliminates the HAMi underflow downstream.

    v1.0.1: workaround HAMi-core UINT64 accounting underflow that crashes the pod after long agentic sessions (~99K active context observed in Hermes Agent usage). The crash signature is `[HAMI-core ERROR]: Device 0 OOM 18446744073709500456 / 25480396800` — that 19-digit number is NOT a real allocation request, it's `2^64 - X` from an unsigned subtraction past zero in HAMi-core's internal allocator counter after many DFlash spec decoding micro-allocations. cublasSgemm_v2 fails → ggml_abort → pod restart.
    Workaround: bump `CUDA_DEVICE_MEMORY_LIMIT_0` 24300m → 30000m (above physical 24463 MB). HAMi-core stops gating allocations strictly, and BeeLlama hits the real physical VRAM limit cleanly via standard cudaMalloc errors if that ever happens. Tradeoff: HAMi GPU sharing no longer enforces this app's memory budget, so concurrent GPU apps could compete more aggressively. Acceptable since this app needs ~24 GB and any concurrent app would conflict anyway.
    No bench change vs v1.0.0 (the inference path is identical) — this is purely a stability fix for sustained long-context sessions.

    v1.0.0: initial release. Qwen3.6 27B vision-capable served via BeeLlama.cpp v0.1.2 with mmproj F16 vision projector + DFlash spec decoding + turbo3 KV cache. **First public bench of mmproj + DFlash + BeeLlama on consumer Blackwell sm_120**:

    Validated 2026-05-15 on Olares One (10-run AVG, Space Invaders HTML prompt 2000 tokens each):
    - **106.43 t/s AVG @ 200K context** (range 93.29-116.67, range 23.38)
    - **101.98 t/s AVG @ 128K context** (10 runs, range 92.69-109.62)
    - Vision smoke test: gradient PNG → correctly identified "Red" gradient

    Trade-off vs llamacppqwen36beellamaone v1.0.2 (text-only, 107.54 t/s @ 262K):
    - -1% throughput (106.43 vs 107.54)
    - -23% max context (200K vs 262K)
    - **+vision capability** (image input via OpenAI image_url content type)
    - DFlash drafter still firing alongside mmproj (~27% accept rate validated on vision prompts)

    Stack:
    - Image: docker.io/aamsellem/beellama-cpp:0.1.2 (custom amd64+CUDA13+sm_120 build of Anbeeld/beellama.cpp v0.1.2)
    - Target: unsloth/Qwen3.6-27B-GGUF UD-Q3_K_XL (14.5 GB, non-MTP variant required by DFlash spec mode)
    - Vision projector: unsloth mmproj-F16.gguf (0.93 GB)
    - DFlash drafter: spiritbuun/Qwen3.6-27B-DFlash-GGUF dflash-draft-3.6-q8_0 (1.85 GB)
    - KV cache: turbo3 (3-bit Walsh-Hadamard, scales gracefully — only 6.2 GB @ 200K vs 14 GB f16 KV would be)
    - Spec: --spec-type dflash --spec-dflash-cross-ctx 1024
    - Throughput: --batch-size 2048 --ubatch-size 2048 (mandatory ≥ image_max_tokens for non-causal vision encoder, llama.cpp PR #21550) --parallel 1 --flash-attn on --mlock --no-mmap

    VRAM budget on 24 GB (tight): target 14.5 + drafter 1.85 + mmproj 0.93 + turbo3 KV @ 200K ~6.2 = ~23.5 GB used.

    When to use this app vs llamacppqwen36beellamaone v1.0.2:
    - Need vision input (image_url content type) → use THIS app
    - Pure text @ max context 262K → use llamacppqwen36beellamaone v1.0.2
    - For Gemma 4 vision (different model) → vllmgemma426ba4bvisionone (136 t/s, vLLM path)

    First launch downloads ~17 GB (target + drafter + mmproj). OpenAI-compatible chat API with image_url multimodal content type on port 8000.

    BeeLlama fork chain: ggml-org/llama.cpp → TheTom/llama-cpp-turboquant (turbo3 KV) → spiritbuun/buun-llama-cpp (DFlash for Qwen3.6) → Anbeeld/beellama.cpp v0.1.2 (latest: profit controller fix, EOS handling for tool calling, multi-GPU correctness fallback).
  fullDescription: |
    Qwen3.6 27B vision-capable via BeeLlama.cpp on Olares One — 106 t/s with image input @ 200K context.
    RTX 5090M (24 GB GDDR7, sm_120 Blackwell consumer mobile) + 96 GB DDR5 + Core Ultra 9 275HX.

    Stack:
      - Image: aamsellem/beellama-cpp:0.1.2 (custom amd64+CUDA13+sm_120 build of Anbeeld/beellama.cpp v0.1.2)
      - Target: unsloth/Qwen3.6-27B-GGUF UD-Q3_K_XL non-MTP variant (14.5 GB)
      - Vision projector: unsloth mmproj-F16.gguf (0.93 GB)
      - DFlash drafter: spiritbuun dflash-draft-3.6-q8_0 (1.85 GB)
      - KV cache: turbo3 (3-bit Walsh-Hadamard rotated, scales linearly with context)
      - Spec method: DFlash with --spec-dflash-cross-ctx 1024
      - Context: 200K (per-seq with DFlash dual-buffer)

    Bench validated 2026-05-15 (10-run AVG, Space Invaders HTML 2000 tokens):
      - 106.43 t/s AVG @ 200K context (range 93.29-116.67)
      - Vision smoke test: PNG gradient → "Red" correctly identified
      - DFlash drafter fires alongside mmproj (~27% accept on vision prompts)

    Trade-off vs text-only llamacppqwen36beellamaone:
      - -1% throughput, -23% max context (200K vs 262K)
      - +vision capability via OpenAI image_url content type

    Apache 2.0 license. Thinking mode + tool calling supported.
    First launch downloads ~17 GB. OpenAI-compatible API on port 8000.

  developer: aamsellem
  website: https://github.com/Anbeeld/beellama.cpp
  sourceCode: https://github.com/aamsellem/olares-one-market
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: MIT
      url: https://github.com/ggml-org/llama.cpp/blob/master/LICENSE

  accelerator:
    - mode: nvidia
      requiredCpu: "4"
      limitedCpu: "16"
      requiredMemory: 22Gi
      limitedMemory: 40Gi
      requiredDisk: 25Gi
      limitedDisk: 40Gi
      requiredGPUMemory: 1Gi
      limitedGPUMemory: 24Gi

  supportArch:
    - amd64
permission:
  appData: true
  # The chart reads and writes the shared HuggingFace cache under
  # /olares/rootfs/Common/huggingface; the declaration was missing.
  appCommon: true
options:
  apiTimeout: 0
  # The fix: deploys into `qwen36beellamavision-shared` instead of the per-user
  # namespace and force-enables cross-namespace access (mesh sidecar +
  # NetworkPolicy), so other apps can reach the engine at
  # http://llminit.qwen36beellamavision-shared:8090/v1. Also makes the install
  # admin-only, hence spec.onlyAdmin above.
  shared: true
  # Marks the app as an LLM provider for gateway-aware consumers. No gateway is
  # installed on this box today, so this is currently inert — kept because every
  # v3 LLM app in beclab/apps sets it.
  LLMGatewaySupported: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: HUGGINGFACE_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
