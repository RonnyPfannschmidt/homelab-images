# The base image is mod_php under prefork, so the knob that corresponds to the
# NixOS pool's pm.max_children = 120 is MaxRequestWorkers. Not the same
# mechanism - every prefork child carries its own interpreter, where php-fpm
# pooled them - but it is the same ceiling on concurrent PHP, which is what the
# box was sized for.
<IfModule mpm_prefork_module>
    StartServers          12
    MinSpareServers        6
    MaxSpareServers       18
    MaxRequestWorkers    120
    MaxConnectionsPerChild 500
</IfModule>
