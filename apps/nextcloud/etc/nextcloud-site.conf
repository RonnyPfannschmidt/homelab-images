# The vhost, and the reason this image needs no rsync.
#
# DocumentRoot is /var/www/nextcloud, a path the base image never declared as a
# VOLUME, so the code is served straight out of the image layer. /var/www/html
# is still a declared VOLUME and nothing can un-declare it; it stays an empty
# directory that podman keeps creating an empty anonymous volume over, and
# nothing reads either.
#
# The block below is what `occ maintenance:update:htaccess` appends to
# .htaccess when `htaccess.RewriteBase` is set - see
# lib/private/Setup.php::updateHtaccess, which is the copy to diff against on a
# version bump. It cannot be generated during the build: that command is not
# registered until the instance is installed ("Nextcloud is not installed -
# only a limited number of commands are available"), and the build has no
# database. It cannot be generated at start either, because the webroot is
# read-only. So it lives here, in config the image owns, instead of in
# .htaccess, which is part of the signed core.
#
# `RewriteOptions Inherit` is load-bearing. mod_rewrite does not merge
# per-directory configurations: a .htaccess containing `RewriteEngine` replaces
# the <Directory> rules outright, and the shipped .htaccess has its own block -
# the .well-known redirects, the 404s on config/ lib/ 3rdparty/, the WebDAV
# user-agent rule. Measured against this image, three requests, three answers:
#
#   (none)             /foo/bar -> Apache 404          our rules discarded
#   InheritDownBefore  /foo/bar -> index.php           but .well-known/carddav
#                                                      also hit index.php, ahead
#                                                      of its own 301
#   Inherit            /foo/bar -> index.php  AND  .well-known/carddav -> 301
#
# Inherit puts the child's rules first and ours last, which is exactly the
# ordering upstream gets by appending to the same file.
<VirtualHost *:80>
	DocumentRoot /var/www/nextcloud

	<Directory /var/www/nextcloud>
		Require all granted
		# The shipped .htaccess still does the work it always did. It is read
		# from a read-only layer, which Apache does not mind - it only ever
		# reads the file.
		AllowOverride All
		RewriteOptions Inherit

		Options -MultiViews +FollowSymLinks

		ErrorDocument 403 /index.php/error/403
		ErrorDocument 404 /index.php/error/404

		<IfModule mod_rewrite.c>
			RewriteEngine on
			RewriteBase /
			RewriteRule ^core/js/oc.js$ index.php [PT,E=PATH_INFO:$1]
			RewriteRule ^core/preview.png$ index.php [PT,E=PATH_INFO:$1]
			RewriteCond %{REQUEST_FILENAME} !\.(css|js|mjs|svg|gif|ico|jpg|jpeg|png|webp|html|otf|ttf|woff2?|map|webm|mp4|mp3|ogg|wav|flac|wasm|tflite)$
			RewriteCond %{REQUEST_FILENAME} !/core/ajax/update\.php
			RewriteCond %{REQUEST_FILENAME} !/core/img/(favicon\.ico|manifest\.json)$
			RewriteCond %{REQUEST_FILENAME} !/(cron|public|remote|status)\.php
			RewriteCond %{REQUEST_FILENAME} !/ocs/v(1|2)\.php
			RewriteCond %{REQUEST_FILENAME} !/robots\.txt
			RewriteCond %{REQUEST_FILENAME} !/(ocs-provider|updater)/
			RewriteCond %{REQUEST_URI} !^/\.well-known/(acme-challenge|pki-validation)/.*
			RewriteCond %{REQUEST_FILENAME} !/richdocumentscode(_arm64)?/proxy.php$
			RewriteRule . index.php [PT,E=PATH_INFO:$1]
			<IfModule mod_env.c>
				SetEnv front_controller_active true
				<IfModule mod_dir.c>
					DirectorySlash off
				</IfModule>
			</IfModule>
		</IfModule>
	</Directory>

	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
