; Carried over from the NixOS instance. The interned strings buffer is the one
; value that was deliberately raised there - Nextcloud's own admin panel asks
; for it once the app count is this high.
opcache.interned_strings_buffer = 12
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60

memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 3600
max_input_time = 3600
