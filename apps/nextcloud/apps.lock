# app<TAB>version<TAB>sha256<TAB>url - the pin, and the only thing the build reads.
#
# Deliberately whitespace-separated rather than TOML: the Containerfile reads
# it with `while read`, in a base image that has no Python. pin_apps.py is what
# rewrites it; nothing generates it during a build.
#
# Versions were the ones the NixOS instance served on 2026-09-16, and moved to
# the newest the Nextcloud 33 feed offered when the base went to 33.0.9. Moving
# any of them is an edit here and a commit - which is the point.
#
# The same three move on every major and nothing else does. groupfolders,
# impersonate and richdocuments pin `max-version` to the server they ship
# against, so each of them is stale the moment the base moves and `occ upgrade`
# would disable them and not re-enable them. The other six carry a version that
# satisfies 33 and 34 both, so the 34 bump left them alone.
#
# Fifteen of that instance's apps are deliberately absent, dropped in two
# passes after measuring what each one actually held.
#
# 2026-09-17, seven: forms, cospend and tables held data nobody had touched
# since 2023-2025; news, polls and files_retention had none and no
# configuration; onlyoffice was a second office suite with no document server
# configured at all, behind the Collabora that actually serves.
#
# 2026-09-18, eight more. integration_paperless and sociallogin were the
# onlyoffice shape again - installed, enabled, wired to nothing: paperless had
# no server URL or token, and sociallogin was fully configured with OAuth
# providers and had zero rows in oc_sociallogin_connect, so not one login ever
# came through it. whiteboard had a single .whiteboard file to show for a
# container, a podman secret and a slice of nextcloud-setup. collectives, deck
# and tasks lost to the Obsidian vault, which does the same job better: deck
# was 11 cards of which 6 were Nextcloud's own German sample data, duplicated
# across two boards both named "Persoenlich"; tasks was 29 VTODOs last touched
# 2025-08; collectives was 18 pages last edited 2025-11. All three were
# exported to Archive/Privat/Nextcloud-Export-2026-09-18 first.
#
# memories and spreed went the same day for the same kind of reason - the thing
# that justified them had quietly stopped. memories was set up deliberately in
# 2024, timelinePath pinned by hand to /SofortUpload, and the phone's instant
# upload stopped that year: zero camera photos since, while the indexer still
# walked 14775 files every cron tick, 8033 of them theresa's phone backup that
# the configured timeline does not even show. spreed held 179 chat messages of
# which 148 were its own changelog and sample bots; the last one-to-one message
# a human sent was in 2022. Photos are untouched by this - the bundled Photos
# app still browses them.
#
# Removing an app from this file only takes its code away - `occ app:disable`
# on the running instance, BEFORE the code goes, is what runs its uninstall
# steps. Their tables are still in the database.
#
# Every tarball unpacks to exactly one directory named for its app; the build
# checks that rather than trusting it.
