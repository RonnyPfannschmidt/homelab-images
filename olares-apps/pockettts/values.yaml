# Replica lever. Olares drives it (the manifest's `workloadReplicas`), and the
# CI harness zeroes it so a render test never starts a pod.
workloads:
  pockettts:
    replicaCount: 1

# Built from apps/pockettts by build-pockettts.yml, which fails while this
# pins anything but that build.
image: ghcr.io/ronnypfannschmidt/pockettts@sha256:814a6c90e031819576b2914fdcf348788b43281921defbed0697ba0c3db74af7

# Olares fills this at install time from `permission.appData`.
userspace:
  appData: ''
