olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
workloadReplicas:
  routerimages: 1
metadata:
  name: routerimages
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  description: A synchronous OpenAI image API in front of Router, so Open WebUI can generate images with FlowStudio workflows
  title: Router Images
  version: 0.2.0
  categories:
    - AI Agents
# An entrance because every app needs one; there is nothing to open.
entrances:
  - name: routerimages
    port: 8080
    host: routerimages
    title: Router Images
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    openMethod: window
    authLevel: internal
    invisible: true
# How other apps reach it: http://<hash>.shared.olares.com/v1, through the app
# gateway, the way they reach Router. The Service in front of the pod is not
# enough - app-np admits only system and user-internal namespaces, and Open
# WebUI's is neither (measured 2026-10-12: a 504 from Open WebUI's mesh proxy,
# nothing in this pod's log). The hash is Olares' own, read off the installed
# app.
sharedEntrances:
  - name: routerimages
    host: sharedentrances-api
    port: 0
    title: Router Images
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    authLevel: internal
    invisible: true
spec:
  # Required by lint whenever options.shared is true.
  onlyAdmin: true
  versionName: 0.2.0
  upgradeDescription: |
    v0.2.0: reachable from other apps. A shared entrance (`sharedentrances-api`, port 80) gives it a `*.shared.olares.com` host through the app gateway; 0.1.0's Service was fenced off from Open WebUI's namespace. The image moves to Python 3.14.
    v0.1.0: initial release.
  fullDescription: |
    Router serves FlowStudio image workflows only asynchronously: a plain
    `POST /v1/images/generations` is refused with
    `image_generation_async_required`, the prompt has to sit under
    `flowstudio.params` by the workflow's own field name, and the picture is
    collected from a `content_url` once the generation completes.

    This app answers the ordinary, synchronous OpenAI request - the one Open
    WebUI's `openai` image engine sends - by doing that on the caller's behalf
    and returning `data[].b64_json`. A model that is not a FlowStudio workflow
    is passed to Router unchanged.

    Calls reach Router as this app, through its shared entrance, so Router's
    usage log names this app rather than the original caller.

    Set `ROUTER_URL` to Router's shared entrance as the apps on the box reach
    it, e.g. `http://<hash>.shared.olares.com/v1`. Callers reach this app the
    same way, at its own shared entrance.
  developer: ronnypfannschmidt
  submitter: ronnypfannschmidt
  website: https://github.com/RonnyPfannschmidt/homelab-images
  sourceCode: https://github.com/RonnyPfannschmidt/homelab-images/tree/main/apps/routerimages
  locale:
    - en-US
  requiredCpu: 50m
  limitedCpu: 500m
  requiredMemory: 64Mi
  limitedMemory: 256Mi
  requiredDisk: 16Mi
  limitedDisk: 64Mi
  supportArch:
    - amd64
permission:
  appData: false
options:
  apiTimeout: 0
  # Deploys into `routerimages-shared`, once for the whole box.
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: ROUTER_URL
    type: string
    required: true
    editable: true
    applyOnChange: true
    regex: "^https?://"
    description: >-
      Router's OpenAI base as apps on this box reach it, e.g. http://<hash>.shared.olares.com/v1.
  - envName: GENERATION_TIMEOUT
    type: string
    default: "600"
    required: false
    editable: true
    applyOnChange: true
    regex: "^[0-9]+$"
    description: >-
      Seconds to wait for one generation. 600 is FlowStudio's own budget for starting an engine.
