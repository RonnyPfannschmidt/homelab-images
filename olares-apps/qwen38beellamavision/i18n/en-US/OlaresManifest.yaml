metadata:
  title: Qwen38 27B BeeLlama Vision One
  description: "Qwen3.8 27B vision-capable via BeeLlama.cpp + mmproj — MTP speculative decoding @ 160K with image input on Olares One"

spec:
  fullDescription: |
    Qwen3.8 27B vision-capable served via upstream Anbeeld/beellama.cpp v0.4.3.
    Image: ghcr.io/anbeeld/beellama.cpp:server-cuda13-v0.4.3 (CUDA 13, sm_120 Blackwell).
    Target: unsloth/Qwen3.8-27B-GGUF UD-Q3_K_XL (13.44 GB, MTP-free as the draft pairing requires).
    Vision projector: unsloth mmproj-F16.gguf (0.93 GB).
    MTP draft head: ggml-org/Qwen3.8-27B-GGUF mtp-Qwen3.8-27B-Q8_0.gguf (3.16 GB) — the Qwen3.8 checkpoint's Multi-Token-Prediction weights extracted to a standalone GGUF, which is the only form llama-server can load them in.
    KV cache: kvarn3 (3-bit; BeeLlama v0.4.0 removed the turbo3/TurboQuant formats the Qwen3.6 app used).
    Spec: --spec-type draft-mtp --spec-draft-n-max 3, batch 2048, ubatch 2048 (mandatory >= image_max_tokens for the non-causal vision encoder).
    Context: 160K, below the model's native 262K because the MTP head occupies VRAM the Qwen3.6 app's DFlash drafter did not.
    Not benchmarked on this box yet. Published Qwen3.8 MTP numbers elsewhere (Q8_0 target, 97K, one session) show 57.3% draft accept overall and a 1.6x-2.7x speedup depending on text kind.
    Difference vs qwen36beellamavision: MTP instead of DFlash, because no DFlash drafter has been published for Qwen3.8 and a DFlash drafter is target-specific.
    OpenAI-compatible chat API with image_url multimodal content type; reachable in-cluster at http://llminit.qwen38beellamavision-shared:8090/v1.
