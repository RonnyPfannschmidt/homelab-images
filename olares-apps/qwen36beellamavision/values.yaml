admin: ""
bfl:
  username: ""
workloads:
  llminit:
    replicaCount: 1
  qwen36beellamavision:
    replicaCount: 1
userspace:
  appData: ""
  appCache: ""
  userData: ""
olaresEnv: {}
model:
  target:
    repo: unsloth/Qwen3.6-27B-GGUF
    file: Qwen3.6-27B-UD-Q3_K_XL.gguf
  mmproj:
    repo: unsloth/Qwen3.6-27B-GGUF
    file: mmproj-F16.gguf
  draft:
    repo: spiritbuun/Qwen3.6-27B-DFlash-GGUF
    file: dflash-draft-3.6-q8_0.gguf
  # No `alias` key: the engine's --alias is pinned to MODEL_NAME in the
  # ConfigMap (see templates/deployment.yaml) because llm-init's readiness gate
  # matches on it. A free-form alias here would silently disable the API.
  ctxSize: "200000"
  threads: "16"
  # Unload model + KV cache from VRAM after this many idle seconds (llama.cpp
  # --sleep-idle-seconds). /health, /props and /v1/models are bypass routes, so
  # probes and llm-init polling do not reset the timer; the first completion
  # request transparently reloads the model. <=0 disables (the flag is then
  # omitted entirely, see the wrapper in templates/deployment.yaml).
  #
  # DISABLED since v1.2.5: freeing ~19 GiB on sleep drives HAMi-core's
  # per-container usage counter negative, and the next wake's cuMemGetInfo hits
  # its `limit < usage` guard -> CUDA_ERROR_INVALID_VALUE -> ggml_abort ->
  # container restart. Cost 4 restarts/day.
  #
  # Keep it disabled, but note this is only a partial mitigation: on 2026-07-31
  # the engine aborted mid-inference with the same underflow (counter at
  # -127960 B) while sleep was already off, so other alloc/free churn drifts the
  # counter too. See docs/olares-qwen36beellama.md.
  sleepIdleSeconds: "-1"
