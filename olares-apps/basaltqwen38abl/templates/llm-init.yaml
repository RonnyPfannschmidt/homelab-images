{{- $consoleDomains := split "," (.Values.domain.basaltconsole | default "") -}}
{{- $consoleDomain := index $consoleDomains "_0" -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelSource := $oe.MODEL_SOURCE | default "" -}}
{{- /* The pack's directory in the shared Hugging Face cache, taken back to UID 1000 before the download. */ -}}
{{- $modelDir := "" -}}
{{- if $modelSource -}}
{{- $repo := trimPrefix "hf://" (index (splitList " " $modelSource) 0) -}}
{{- if contains "/" $repo -}}
{{- $parts := splitList "/" $repo -}}
{{- $modelDir = printf "models--%s--%s" (index $parts 0) (index $parts 1) -}}
{{- end -}}
{{- end -}}
{{- /* MODEL_SUPPORTS names capability groups; Model Console wants the supports_* keys they stand for. */ -}}
{{- $supportsGroups := dict
      "vision" "supports_vision"
      "tools" "supports_function_calling,supports_parallel_function_calling,supports_tool_choice"
      "thinking" "supports_reasoning,supports_reasoning_effort"
      "none" "" -}}
{{- $expanded := list -}}
{{- range $tok := splitList "," ($oe.MODEL_SUPPORTS | default "") -}}
{{- $tok = trim $tok -}}
{{- if $tok -}}
{{- if hasKey $supportsGroups $tok -}}
{{- if index $supportsGroups $tok -}}
{{- $expanded = append $expanded (index $supportsGroups $tok) -}}
{{- end -}}
{{- else -}}
{{- $expanded = append $expanded $tok -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $modelSupports := join "," $expanded -}}
---
# `hf`, found on PATH before the image's own: Model Console downloads the pack with it. Files over 50 GB go over
# plain HTTP, which continues a partial file; the image's hf sends them to hf_xet, which starts again from zero.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-init-hf
  namespace: "{{ .Release.Namespace }}"
data:
  hf: |
    #!/usr/local/bin/python3.12
    """`hf`, as Model Console calls it, with files over 50 GB downloaded over plain HTTP.

    huggingface_hub refuses plain HTTP above 50 GB and hands such a file to hf_xet, which starts a
    broken download again from zero. Plain HTTP continues the partial file (blobs/<sha256>.incomplete)
    with a Range request, after a network error and on the next start; the Hub serves these files that
    way. A blob that was continued is checked against its SHA-256, which is its name, before it is used.
    """
    import hashlib
    import sys
    import time
    from pathlib import Path

    from huggingface_hub import constants

    constants.MAX_HTTP_DOWNLOAD_SIZE = 1 << 62

    from huggingface_hub.cli.hf import main  # noqa: E402

    MARKER = ".plain-http"  # every partial file beside it was written in order, by plain HTTP


    def blobs_dir(argv):
        if len(argv) < 3 or argv[1] != "download":
            return None
        cache = constants.HF_HUB_CACHE
        if "--cache-dir" in argv[:-1]:
            cache = argv[argv.index("--cache-dir") + 1]
        return Path(cache) / ("models--" + argv[2].replace("/", "--")) / "blobs"


    def sha256_of(path):
        digest, done, said = hashlib.sha256(), 0, time.monotonic()
        with path.open("rb") as f:
            while chunk := f.read(64 << 20):
                digest.update(chunk)
                done += len(chunk)
                if time.monotonic() - said > 5:  # Model Console stops a download that says nothing for 10 minutes
                    print(f"[hf] checking {path.name[:12]}: {done >> 30} GiB", file=sys.stderr, flush=True)
                    said = time.monotonic()
        return digest.hexdigest()


    def run():
        blobs = blobs_dir(sys.argv)
        continued = []
        if blobs is not None:
            blobs.mkdir(parents=True, exist_ok=True)
            if not (blobs / MARKER).exists():
                # hf_xet does not write a file from its start to its end: its partial files cannot be continued.
                for partial in blobs.glob("*.incomplete"):
                    print(f"[hf] removing {partial.name}: not written by plain HTTP", file=sys.stderr, flush=True)
                    partial.unlink()
                (blobs / MARKER).touch()
            continued = [p.name[: -len(".incomplete")] for p in blobs.glob("*.incomplete") if p.stat().st_size]

        try:
            code = main()
        except SystemExit as e:
            code = e.code
        if code not in (None, 0):
            return code

        for name in continued:
            blob = blobs / name
            if len(name) != 64 or not blob.is_file():
                continue
            if sha256_of(blob) != name:
                blob.unlink()
                print(f"[hf] {name[:12]}: SHA-256 differs after a continued download; removed, starting again",
                      file=sys.stderr, flush=True)
                return 1
            print(f"[hf] {name[:12]}: SHA-256 matches", file=sys.stderr, flush=True)
        return 0


    if __name__ == "__main__":
        sys.exit(run())
---
# Model Console (no GPU): downloads the pack into the shared Hugging Face cache, hands its path and the engine
# arguments to the engine's wrapper, and serves on :8090 its status page, the model card Router reads
# (/api/model-spec) and the /v1 API, which it forwards to the engine at http://strata:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llminit
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: llm-init
spec:
  replicas: {{ .Values.workloads.llminit.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: llm-init
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: llm-init
    spec:
      restartPolicy: Always
      enableServiceLinks: false
      # The run state is a node-local path shared with the engine: follow the engine onto its node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - "{{ .Release.Name }}"
              namespaces:
                - "{{ .Release.Namespace }}"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ .Values.userspace.appCache }}/llm-init-run/{{ .Release.Name }}"
            type: DirectoryOrCreate
        - name: hf-bin
          configMap:
            name: llm-init-hf
            defaultMode: 0555
      initContainers:
        # Host paths are created root-owned; Model Console runs as UID 1000.
        - name: init-chown
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - -c
            - "mkdir -p /cache/hf/hub/.locks{{ if $modelDir }} /cache/hf/hub/{{ $modelDir }}{{ end }} && chown 1000:1000 /cache/hf/hub /cache/hf/hub/.locks /run/llm-init{{ if $modelDir }} && chown -R 1000:1000 /cache/hf/hub/{{ $modelDir }}{{ end }}"
          securityContext:
            runAsUser: 0
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: run-state
              mountPath: /run/llm-init
      containers:
        - name: llm-init
          image: "docker.io/beclab/llm-init:v1.7.26"
          imagePullPolicy: IfNotPresent
          env:
            - name: ENGINE_KIND
              value: strata
            - name: MODEL_NAME
              value: {{ $oe.MODEL_NAME | default "" | quote }}
            - name: MODEL_SOURCE
              value: {{ $modelSource | quote }}
            - name: MODEL_MODE
              value: {{ $oe.MODEL_MODE | default "chat" | quote }}
{{- if $modelSupports }}
            - name: MODEL_SUPPORTS
              value: {{ $modelSupports | quote }}
{{- end }}
{{- if $oe.MODEL_REASONING_EFFORT }}
            - name: MODEL_REASONING_EFFORT
              value: {{ $oe.MODEL_REASONING_EFFORT | quote }}
{{- end }}
{{- if $oe.MODEL_REASONING_EFFORT_DEFAULT }}
            - name: MODEL_REASONING_EFFORT_DEFAULT
              value: {{ $oe.MODEL_REASONING_EFFORT_DEFAULT | quote }}
{{- end }}
            - name: ENGINE_ARGS
              value: {{ $oe.ENGINE_ARGS | default "" | quote }}
{{- if $oe.HF_ENDPOINT }}
            - name: HF_ENDPOINT
              value: {{ $oe.HF_ENDPOINT | quote }}
{{- end }}
{{- if $oe.HF_TOKEN }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: basaltqwen38abl-secrets
                  key: HF_TOKEN
{{- end }}
            - name: RUN_DIR
              value: /run/llm-init
            - name: PORT
              value: "8090"
            - name: LOG_LEVEL
              value: {{ $oe.LOG_LEVEL | default "info" | quote }}
            - name: LOG_FORMAT
              value: json
            # The model is one 87.6 GB file. hf_xet (off in Model Console unless asked) cannot continue a broken
            # download; the hf of llm-init-hf, first on PATH, downloads it over plain HTTP, which can.
            - name: PATH
              value: /llm-init/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
{{- if $consoleDomain }}
            - name: APP_URL
              value: "https://{{ $consoleDomain }}"
{{- end }}
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /livez
              port: 8090
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: run-state
              mountPath: /run/llm-init
            - name: hf-bin
              mountPath: /llm-init/bin
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
# Model Console's page, as the app's first entrance.
apiVersion: v1
kind: Service
metadata:
  name: download-svc
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
---
# The shared entrance: what Router and the other apps of this Olares call.
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-api
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: llm-init
spec:
  selector:
    io.kompose.service: llm-init
  ports:
    - name: http
      port: 80
      targetPort: 8090
  type: ClusterIP
