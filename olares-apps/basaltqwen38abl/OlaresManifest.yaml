olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'

workloadReplicas:
  basaltqwen38abl: 1
  llminit: 1

metadata:
  name: basaltqwen38abl
  icon: https://orales-one-market.aamsellem.workers.dev/icons/basaltqwen38one.png
  description: "Fork of aamsellem's basaltqwen38one 1.3.2 with Cudecnik's refusal-projection control vector loaded: the same pack and engine, refusals projected out of the residual stream at runtime"
  appid: basaltqwen38abl
  title: Anaelith Qwen38 Flash Next One (abliterated)
  version: '1.3.2'
  categories:
    - LLM Chat
    - AI Agents
  tags:
    - llm
sharedEntrances:
  - name: basaltqwen38abl
    host: sharedentrances-api
    port: 0
    title: Anaelith Qwen38 Flash Next
    icon: https://orales-one-market.aamsellem.workers.dev/icons/basaltqwen38one.png
    invisible: true
    authLevel: internal
entrances:
  - name: basaltconsole
    port: 8090
    host: download-svc
    title: Anaelith Qwen38 Flash Next
    icon: https://orales-one-market.aamsellem.workers.dev/icons/basaltqwen38one.png
    openMethod: window
    authLevel: internal
  - name: basaltchat
    port: 8080
    host: basaltqwen38abl
    title: Anaelith Chat and API
    icon: https://orales-one-market.aamsellem.workers.dev/icons/basaltqwen38one.png
    openMethod: window
    authLevel: internal
spec:
  onlyAdmin: true
  versionName: '0.4.1-anaelith.1'
  upgradeDescription: |
    v1.3.2: forked from basaltqwen38one 1.3.2 with the refusal-projection control vector.
  fullDescription: |
    A copy of aamsellem's basaltqwen38one 1.3.2 (olares-one-market) for switching between the stock model and an
    abliterated one by app. Same engine image, same pack, same shared Hugging Face cache, so installing it downloads
    nothing big. What differs:

    - ENGINE_ARGS loads Cudecnik/Qwen3.8-Flash-Next-refusal-projection (revision 1886570b, 0.5 MB) in projection
      mode on layers 4-44: h -= (h.v)v per layer. The init container fetch-cvec downloads it into the app's data
      directory and checks its SHA-256.
    - Router lists it as Olares/jesdga/Qwen3.8-Flash-Next-Basalt:UD-IQ3_XXS-abliterated.
    - A request sending "experimental_speed_projection": false gets the stock model for that request.

    Like the original it needs the whole GPU and about 60 GB of RAM: stop basaltqwen38one before starting this one.

  developer: aamsellem
  website: https://github.com/aamsellem/olares-one-market
  sourceCode: https://github.com/aamsellem/anaelith
  submitter: aamsellem
  locale:
    - en-US
  license:
    - text: MIT (anaelith, Basalt)
      url: https://github.com/aamsellem/anaelith/blob/one/LICENSE
    - text: Qwen license (model)
      url: https://huggingface.co/jesdga/Qwen3.8-Flash-Next-Basalt/blob/main/LICENSE
  supportArch:
    - amd64
  accelerator:
    - mode: nvidia
      supportMultiCard: false
      supportMultiNodes: false
      requiredCpu: "8"
      limitedCpu: "24"
      requiredMemory: 57Gi
      limitedMemory: 84Gi
      requiredDisk: 100Gi
      limitedDisk: 140Gi
      requiredGPUMemory: 20Gi
      limitedGPUMemory: 23Gi
permission:
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  shared: true
  templateOnly: false
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "hf://jesdga/Qwen3.8-Flash-Next-Basalt --revision 65de5a9e636e8bbe1200cbcd6eb8aa421e6a66c6 --include Qwen3.8-FN-UD-IQ3_XXS.basalt"
    description: "The pack Model Console downloads: one .basalt file, at a pinned revision of its Hugging Face repository."
  - envName: MODEL_NAME
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "jesdga/Qwen3.8-Flash-Next-Basalt:UD-IQ3_XXS-abliterated"
    description: "The model's name in Router and on the API."
  - envName: MODEL_MODE
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "chat"
  - envName: MODEL_SUPPORTS
    required: true
    type: string
    editable: false
    applyOnChange: false
    default: "thinking,tools,vision"
  - envName: MODEL_REASONING_EFFORT
    required: false
    type: string
    editable: false
    applyOnChange: false
    default: "none,minimal,low,medium,high,xhigh,max"
    description: "The reasoning_effort values the server accepts. none and minimal turn thinking off; high, xhigh and max are the model's highest level."
  - envName: MODEL_REASONING_EFFORT_DEFAULT
    required: false
    type: string
    editable: false
    applyOnChange: false
    default: "xhigh"
    description: "The level the model uses when a request names none."
  - envName: ENGINE_ARGS
    required: true
    type: string
    editable: true
    applyOnChange: true
    default: "--context 262144 --parallel 2 --kv int8 --resident-budget-gib 48 --ram-reserve-mib 12288 --pool-workers 15 --fit-max-tokens --exp umwait=2 --vision dynamic --control-vector-scaled /data/cvec/Qwen3.8-Flash-Next-refusal-projection.gguf:1.0 --control-vector-layer-range 4 44 --cvec-mode project --cvec-dir per-layer"
    description: "Options of basalt serve. --context is each conversation's window (the server's --max-context) and --parallel the conversations served at once (each gets the whole window). --parallel 1 --context 131072 was the default before 1.2.5. The pack, the model name, the address and the access rules are set by the app. --vision dynamic lets the model read images; remove it to run text only. Add --no-grammar to stop holding tool calls and JSON answers to a grammar."
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "info"
    options:
      - title: Debug
        value: debug
      - title: Info
        value: info
      - title: Warn
        value: warn
      - title: Error
        value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_SYSTEM_HUGGINGFACE_TOKEN
