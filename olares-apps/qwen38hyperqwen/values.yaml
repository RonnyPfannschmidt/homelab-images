admin: ""
bfl:
  username: ""
workloads:
  # The entrance and progress dashboard. Ready in seconds, which is what lets
  # the Olares install operation finish instead of timing out on the engine.
  llminit:
    replicaCount: 1
  qwen38hyperqwen:
    replicaCount: 1
userspace:
  appData: ""
  appCache: ""
  userData: ""
olaresEnv: {}

model:
  # The only checkpoint HyperQwen's prepare pipeline knows how to requantize.
  # prepare.sh hardcodes this repo as its HF_REPO default and derives every
  # later step from the shard layout it ships, so this is not a swappable
  # quant the way the beellama charts' GGUF is — changing it means changing
  # BASE_MODEL_DIR too, and the requant scripts may simply not match.
  repo: dbirks/Qwen3.8-27B-W4A16-AutoRound
  # --served-model-name is hardcoded to this in single-user/start_qwen.sh and
  # batch/start_qwen.sh. Declared here because Open WebUI and opencode name it,
  # NOT because the chart can change it: overriding this value alone would make
  # every consumer point at a model id the engine does not advertise.
  servedName: qwen3.8-27b
  # ~1 GB on top of the ~19.5 GB base: int4-GPTQ lm_head/MTP plus an
  # own-output draft vocabulary. start_qwen.sh prefers the `-fast` directory
  # automatically when it exists, so "0" here is the only way to serve the
  # plain one. Off only if first-boot download time matters more than decode
  # speed.
  fastVariant: "1"
  # The W4A16 DFlash2 drafter (~1 GB), fetched by prepare regardless of which
  # profile is active. That is deliberate: it is what makes the profile
  # switch below a pure restart instead of another download. "0" only if the
  # `fast` profile will never be used.
  dflash2: "1"

# Everything here is read by the image's own launcher from the environment and
# validated by /app/resolve_config.sh, which refuses an unknown CTX or SPEC
# *before* the engine boots rather than falling through to a default. So a
# profile change is a `helm upgrade` plus a pod restart: no re-download, no
# re-requantization, and a typo fails fast and visibly in the container log.
profile:
  # single | batch. One GPU runs one mode at a time. `single` is the
  # low-latency path (speculative decoding, MAX_SEQS small); `batch` is the
  # throughput path that upstream measures at ~1,035 tok/s over 64 concurrent
  # requests. Open WebUI plus one opencode session is the single-user case.
  mode: single
  # fast | long | huge. NOT read by the launcher directly: it names an entry
  # in `servingProfiles` below, and it is only the fallback for
  # `SERVING_PROFILE`, the env Olares Settings can change on a running
  # install. An unknown name fails the render with the list of valid ones
  # rather than reaching /app/resolve_config.sh.
  serving: fast
  # The single-user default. NOT the batch path's 0.972: the DeltaNet
  # workspace in the MTP decode path allocates beyond vLLM's startup memory
  # profile, and upstream's rule of thumb is to keep ~2 GB of VRAM free.
  # Past ~0.975 the engine OOMs at run time, with an error that never
  # mentions the cache.
  #
  # 0.90 rather than upstream's 0.93 because this card is shared: ComfyUI sits
  # on it under Olares TimeSlice, and at 0.93 `long` had ~1.6 GiB above its
  # budget for the engine's non-PyTorch memory (~0.8 GiB), unprofiled
  # transients and the other tenant together. Only the MTP profiles (`long`,
  # `huge`) size their pool from this; each 0.01 is ~0.23 GiB of KV. It is
  # read once at boot, so it cannot follow ComfyUI loading a model later.
  gpuUtil: "0.90"
  # Empty = the per-profile default (65536 fast / 150000 long / 200000 huge).
  # Set only to pull the ceiling *down*; raising it above what the KV pool
  # holds fails at run time, not at boot.
  maxLen: ""
  # Empty = the per-profile default (4 drafts on fast, 3 on long/huge; 7 for
  # dflash2's single verify block). DFLASH_TOKENS=15 is upstream's
  # copy/edit/quote mode — much faster when the answer reuses the prompt, at
  # the cost of request slots and context headroom.
  draftTokens: ""
  # dflash2 only. The launcher reads DFLASH_TOKENS separately from
  # DRAFT_TOKENS above and gives it precedence over MAX_LEN when picking the
  # profile's context default, so the two are not interchangeable.
  dflashTokens: ""
  # KV pool size in BYTES, passed as vLLM's --kv-cache-memory. Empty = the
  # launcher's own pin, which exists only on the DFlash2 path: 5583457484
  # (5.2 GiB) on `fast`. The MTP profiles (`long`, `huge`) ignore this and
  # size the pool from GPU_UTIL - read off their boot logs on 2026-09-23,
  # which carry no kv_cache_memory_bytes at all.
  #
  # Exposed rather than left implicit because it is the single most important
  # VRAM number in this app, and because it is *pinned bytes, not a fraction*
  # — which is what makes the CUDA_DEVICE_MEMORY_LIMIT=0 choice in
  # templates/deployment.yaml safe here. HyperQwen pins it because the V2
  # runner's profiled activation peak swings ~1 GiB between starts; the side
  # effect is that vLLM does not size the pool from what cuMemGetInfo reports,
  # so HAMi-core's drifting usage counter cannot produce a wrong pool at boot.
  # It is this app's equivalent of the `-fit off` the beellama charts pass.
  #
  # Lower it if something else is resident on the card. `sunshine`
  # (steam-headless) holds ~262 MiB continuously, which already eats a
  # quarter of the ~1 GiB of spare the upstream budget assumes on a 24 GiB
  # card.
  kvMem: ""
  # Free-form extra vLLM arguments, appended last. Empty by default; the
  # launcher warns when one of them shadows a control set above.
  extraArgs: ""
  # Image input. "1" keeps the checkpoint's vision tower instead of starting
  # the engine with `--language-model-only`. The tower is already in the
  # prepared weights (0.858 GiB BF16, base and -fast alike), so this costs a
  # restart, not a download. The launcher then adds a 2048-image-token pixel
  # cap and ONE image per request; both can be overridden from EXTRA_ARGS.
  #
  # "Per request" counts the whole conversation, which Open WebUI and opencode
  # resend every turn: a second image in the same chat is refused with a 400,
  # not just a second image in one message.
  vision: "1"
  # With vision on, keep the tower's weights in pinned host RAM and copy each
  # module to the GPU only for its own forward (upstream's
  # vision-tower-cpu-offload patch). Not optional on this card with the `fast`
  # profile: upstream measured SPEC=dflash2 + VISION=1 failing to boot on
  # 24 GB without it, OOMing in graph capture on a 960 MiB verify buffer with
  # 787 MiB free, because the tower takes 0.85 GiB of a ~1.1 GiB margin. With
  # it on, that config boots with the full KV pool. Cost: 296 -> 333 ms of
  # encode per 8192-patch image, output bit-exact (upstream, RTX 3090, PCIe 4.0 x16).
  # Another GPU app already holds part of that margin here: ComfyUI, 318 MiB
  # idle on 2026-09-23.
  visionOffload: "1"
  # The entrypoint's pre-flight (`verify.sh --no-server`): patches applied,
  # torch sees a GPU, flashinfer usable, the prepared model's tensors the
  # shape the config claims. Any FAIL aborts the container rather than
  # serving something subtly wrong, which is the right default — but it also
  # means one check that does not survive HAMi's interception turns into a
  # crashloop with no way out short of editing the chart. Exposed so "0" is a
  # helm upgrade. Turn it off only with the failing line in hand.
  verify: "1"
  # The entrypoint's idempotent model preparation. "1" on every start: it is a
  # state check measured in seconds once the model is there, and it is what
  # makes a wiped models volume heal itself instead of crashlooping. "0" only
  # to prove a boot problem is not prepare's.
  prepare: "1"

# The three serving profiles, as data rather than as three env vars that can
# be combined wrongly. `profile.serving` - or the SERVING_PROFILE env Olares
# Settings writes over it - names one of these keys, and the ConfigMap emits
# what it holds.
#
# Each entry is a *validated* combination, which is why the axes are not
# exposed one by one:
#   - past 64K upstream reports dflash2 losing to mtp roughly 2:1 on
#     everything but verbatim reproduction, so long and huge carry mtp;
#   - ctx=huge + spec=mtp + PREFIX_CACHE=1 returns corrupt prompt_logprobs,
#     and the launcher warns rather than refusing - so huge turns prefix
#     caching off here instead of shipping the warned-about combination.
# The escape hatch for a deliberate experiment is EXTRA_ARGS, not a fourth
# knob.
#
# What each costs, upstream's numbers on an RTX 3090 and nothing measured on
# this box:
#   fast  64K,      bf16 KV via FlashAttention  127 tok/s single-user
#   long  150K,     fp8 KV via FlashInfer       95-100 tok/s
#   huge  200-240K, KVarN 4/2-bit KV            67 tok/s mixed, 164 quoting
#
# Switching costs a pod restart and nothing else: `prepare` fetches the
# DFlash2 drafter whichever profile is active, so no profile is a download.
#
# What a switch does invalidate is every consumer that hardcodes the window.
# `HYPERQWEN_CONTEXT_TOKENS = 65536` in the private repository's
# `specs/olares_agents.py` is the 64K of `fast`; moving to long or huge
# without raising it leaves Hermes, opencode and Open WebUI budgeting against
# a window a third of the real one.
#
# `maxSeqs` caps concurrent requests (MAX_SEQS) where the launcher's default
# is more than this card holds; empty = the launcher's own default. `long`
# defaults to 8 and died at 2 concurrent 1K requests (2026-09-23): a 64 MiB
# activation with 622 MiB free, KV cache 11% full, vision on or off alike. At
# MAX_SEQS=2 the same load survived, soak included. Upstream documents this
# (gotchas.md 35): per-seat allocations scale with max_num_seqs itself, and
# the engine dies on its first real batch when non-KV headroom runs out. The
# MTP profiles (long, huge) size their KV pool from GPU_UTIL rather than a
# pinned KV_MEM, and ComfyUI shares this card under TimeSlice, so that
# headroom is thinner here than on upstream's headless 3090.
servingProfiles:
  fast:
    ctx: fast
    spec: dflash2
    prefixCache: "1"
  long:
    ctx: long
    spec: mtp
    prefixCache: "1"
    maxSeqs: "2"
  huge:
    ctx: huge
    spec: mtp
    prefixCache: "0"
