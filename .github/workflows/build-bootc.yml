# Build every bootc image under bootc/ and publish it to ghcr.io.
#
# Native builds on per-architecture runners rather than QEMU: standard runners
# are free and unlimited on a public repository, arm64 included, so there is no
# reason to emulate a dnf install of a ~900 MB base. `runner` is a matrix field
# so that an arm64 image costs one line to add.

name: bootc images

on:
  push:
    branches:
      - main
    paths:
      - bootc/**
      - trust/**
      - .containerignore
      - .github/workflows/build-bootc.yml
  pull_request:
    paths:
      - bootc/**
      - trust/**
      - .containerignore
      - .github/workflows/build-bootc.yml
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push the built images to ghcr.io
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bootc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write        # cosign keyless
      security-events: write # trivy SARIF

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora-basesetup
            runner: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # A bootc base is ~1 GB compressed and the runners ship 14 GB of disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Work out image name and tags
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/${{ matrix.image }}"
          sha=$(git rev-parse --short HEAD)

          tags="$image:sha-$sha"
          case "${{ github.event_name }}" in
            pull_request) tags="$tags $image:pr-${{ github.event.number }}" ;;
            *)
              if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                tags="$tags $image:latest"
              else
                branch=$(echo "${GITHUB_REF#refs/heads/}" | tr -c '[:alnum:]._-' '-')
                tags="$tags $image:$branch"
              fi
              ;;
          esac

          # Never from a pull request: a fork PR must not reach the registry.
          push=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            push=true
          elif [ "${{ inputs.push_to_registry }}" = "true" ]; then
            push=true
          fi

          {
            echo "image=$image"
            echo "tags=$tags"
            echo "primary=$image:sha-$sha"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: steps.meta.outputs.push == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # podman rather than buildx: it is what these Containerfiles are built
      # with by hand, so a green run means the same command works locally.
      #
      # The context is the repository root, not the image directory, because
      # every image copies trust/ into itself. .containerignore is what keeps
      # that context from carrying the charts and the test harness.
      - name: Build
        run: |
          set -x
          # shellcheck disable=SC2046  # the splitting is the point: the loop
          # emits `-t tag -t tag ...` and each word has to become its own
          # argument. Quoting it would pass one giant tag to podman.
          podman build --pull=always \
            $(for t in ${{ steps.meta.outputs.tags }}; do printf -- '-t %s ' "$t"; done) \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f bootc/${{ matrix.image }}/Containerfile \
            .

      # The check that knows what a bootable container must look like - /var
      # populated at build time, /opt misuse, a missing kernel. Skipped rather
      # than failed if the image has no bootc binary, so a plain container
      # image could join the matrix later without editing this step.
      - name: bootc container lint
        run: |
          img=${{ steps.meta.outputs.primary }}
          if podman run --rm --entrypoint sh "$img" -c 'command -v bootc' >/dev/null 2>&1; then
            podman run --rm --entrypoint bootc "$img" container lint
          else
            echo "no bootc binary in $img - skipping lint"
          fi

      # --digestfile, not `podman inspect .RepoDigests`. podman may convert the
      # manifest on the way out, so the digest the registry stores is not
      # necessarily the one the local image reports - and signing the local one
      # attaches a signature to a digest that no tag resolves to. That happened:
      # `latest` pointed at one digest while the .sig tags sat on others, and
      # every in-CI check passed, because signing digest D and verifying digest
      # D is self-consistent no matter what the tags say.
      - name: Push
        if: steps.meta.outputs.push == 'true'
        run: |
          for t in ${{ steps.meta.outputs.tags }}; do
            podman push --digestfile /tmp/digest "$t"
          done
          echo "digest=${{ steps.meta.outputs.image }}@$(cat /tmp/digest)" >> "$GITHUB_ENV"

      - name: Install cosign
        if: steps.meta.outputs.push == 'true'
        uses: sigstore/cosign-installer@v3

      # Sign the digest, not the tags: a tag is a moving target, and signing it
      # by name signs whatever it pointed at when cosign resolved it.
      # Two signatures, for two different consumers.
      #
      # Keyless is the provenance record: it binds the image to this workflow
      # file at this ref, verifiable by anyone, with a public transparency log
      # entry. Nothing has to be stored for it, and nothing can leak.
      #
      # Keyed is the one a node can act on. podman and bootc read
      # /etc/containers/policy.json, whose fulcio block can only match a
      # `subjectEmail` - and a GitHub Actions certificate has an empty subject
      # and a URI SAN, so a keyless signature is not expressible as a policy
      # requirement at all. Enforcing `bootc upgrade` therefore needs a key.
      - name: Sign (keyless)
        if: steps.meta.outputs.push == 'true'
        run: |
          # cosign needs its own login. `podman login` writes to
          # $XDG_RUNTIME_DIR/containers/auth.json; cosign reads the Docker
          # config, finds nothing there, and fails only at the point where it
          # pushes the signature - after the image itself is already in the
          # registry, which makes it look like a signing bug rather than a
          # credential one.
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "signing $digest"
          cosign sign --yes "$digest"

      # Inert until a key is minted - see docs/signing.md. Conditional on the
      # secret rather than on a flag, so minting the key is the whole switch.
      - name: Sign (keyed)
        if: steps.meta.outputs.push == 'true' && env.COSIGN_PRIVATE_KEY != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$digest"

      # Signing without verifying is decoration - and verifying the digest
      # alone is nearly as decorative, since it is the digest just signed.
      # Every *tag* is checked too, because a tag is what anyone actually
      # pulls, and a tag resolving to an unsigned digest is precisely the
      # failure that got past an earlier version of this file.
      #
      # Identity by regexp, not literal: the identity string carries the ref,
      # so it becomes @refs/tags/... on a tag build and changes entirely if
      # this file is renamed or turned into a reusable workflow. An exact match
      # starts failing silently the first time any of that happens.
      - name: Verify (keyless)
        if: steps.meta.outputs.push == 'true'
        run: |
          for ref in "$digest" ${{ steps.meta.outputs.tags }}; do
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^${{ github.server_url }}/${{ github.repository }}/\.github/workflows/" \
              "$ref" > /dev/null
            echo "verifies: $ref"
          done

      # Against every key the images ship, not just the one just used: this is
      # what proves a node running any trusted key can still accept what CI
      # produces, which is the property a rotation has to preserve.
      - name: Verify (against every trusted key)
        if: steps.meta.outputs.push == 'true'
        run: |
          shopt -s nullglob
          keys=(trust/keys/*.pub)
          if [ ${#keys[@]} -eq 0 ]; then
            echo "no keys in trust/keys - keyed verification not enforced yet"
            exit 0
          fi
          ok=0
          for key in "${keys[@]}"; do
            if cosign verify --key "$key" "$digest" > /dev/null 2>&1; then
              echo "verifies against $key"
              ok=1
            else
              echo "does NOT verify against $key"
            fi
          done
          # Any one is enough, because policy.json uses keyPaths, which accepts
          # a signature made by any key in the list. During a rotation the old
          # key stops matching before it is removed, and that is correct.
          [ "$ok" = 1 ] || { echo "::error::no trusted key verifies this image"; exit 1; }

      # Handed to trivy as a tar rather than by name: the image lives in
      # podman's store, and trivy would resolve a bare reference through the
      # docker daemon, which never sees it.
      - name: Export the image for scanning
        run: podman save --format docker-archive -o /tmp/scan.tar ${{ steps.meta.outputs.primary }}

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/scan.tar
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'   # a Fedora base carries known CVEs; report, do not block

      - name: Reclaim the export
        if: always()
        run: rm -f /tmp/scan.tar

      - name: Upload scan to the Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo
            echo "- runner: \`${{ matrix.runner }}\`"
            echo "- pushed: \`${{ steps.meta.outputs.push }}\`"
            echo "- tags:"
            for t in ${{ steps.meta.outputs.tags }}; do echo "  - \`$t\`"; done
          } >> "$GITHUB_STEP_SUMMARY"
