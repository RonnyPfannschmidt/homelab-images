# Build every application image under apps/ and publish it to ghcr.io.
#
# Sibling of build-bootc.yml rather than another matrix entry in it: these are
# not bootable images, the lint step there does not apply, and they are built
# for two architectures and joined into one manifest list, which that workflow
# has no reason to grow.

name: app images

on:
  push:
    branches:
      - main
    paths:
      - apps/**
      - .containerignore
      - .github/workflows/build-apps.yml
  pull_request:
    paths:
      - apps/**
      - .containerignore
      - .github/workflows/build-apps.yml
  workflow_dispatch:
    inputs:
      push_to_registry:
        description: Push the built images to ghcr.io
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ahead of the build because it answers a question the build cannot. The
  # build fetches each app by URL and checks its hash, which still succeeds
  # for an app the new server will refuse to enable: the app store indexes by
  # platform, and an app whose `info.xml` caps below the server version is
  # simply absent from that platform's feed. `occ upgrade` then disables it
  # and does not re-enable it - on the instance, after the bump.
  #
  # Not gated ahead of `build`: a broken pin and a broken Containerfile are
  # different answers and both are worth having at once.
  pins:
    name: nextcloud pins
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No uv, and no pytest: the script is stdlib-only, and it is the same
      # command to run by hand. Under GITHUB_ACTIONS it also annotates the
      # offending apps.lock lines, so a failure lands on the diff.
      - name: Check every pin against the platform it must serve
        run: ./apps/nextcloud/pin_apps.py --verify

      # Separate step, not folded into --verify: this one asks a question about
      # renovate.json rather than about apps.lock, and a failure here means
      # "the cap is stale", not "a pin is wrong". Reading them as one result
      # would make the wrong file the suspect.
      - name: Check the pinned major is still upstream's production channel
        run: ./apps/nextcloud/pin_apps.py --channel

  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image: [nextcloud]
        arch: [amd64, arm64]
        # `include` entries whose keys are all new do not add combinations -
        # they are merged into the existing ones, in order, so listing arch
        # only here left a single job that was whichever entry came last. arch
        # has to be a matrix axis; include only attaches the runner to it.
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out image name and tags
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/${{ matrix.image }}"
          sha=$(git rev-parse --short HEAD)

          # Per-architecture tags. The manifest job below is what publishes the
          # names anything actually pulls; these exist so it has something to
          # join, and so a failed join leaves a usable image behind.
          primary="$image:sha-$sha-${{ matrix.arch }}"

          push=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            push=true
          elif [ "${{ inputs.push_to_registry }}" = "true" ]; then
            push=true
          fi

          {
            echo "image=$image"
            echo "primary=$primary"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: steps.meta.outputs.push == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" \
            | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # --pull=false: the base is pinned by digest, so there is nothing to
      # refresh, and pulling again on every run costs a gigabyte for nothing.
      - name: Build
        run: |
          set -x
          podman build --pull=false \
            -t "${{ steps.meta.outputs.primary }}" \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f apps/${{ matrix.image }}/Containerfile \
            .

      # The image is only worth publishing if Nextcloud can see the apps that
      # are the reason it exists. `occ` needs a database, so this checks what
      # can be checked without one: the code is where apps_paths will look.
      - name: Smoke test
        run: |
          img=${{ steps.meta.outputs.primary }}
          expected=$(grep -cvE '^[[:space:]]*(#|$)' apps/${{ matrix.image }}/apps.lock)
          count=$(podman run --rm --entrypoint sh "$img" \
            -c 'find /var/www/nextcloud/custom_apps -maxdepth 1 -mindepth 1 -type d | wc -l')
          echo "extra apps present: $count, apps.lock names: $expected"
          test "$count" = "$expected"
          podman run --rm --entrypoint sh "$img" -c 'exiftool -ver && ffmpeg -version | head -1'

          # The webroot is baked, not rsynced. These four are the properties
          # that arrangement depends on, and each of them has a silent failure
          # mode: a resurrected /usr/src/nextcloud would mean a base image
          # bump quietly went back to the rsync layout, a writable webroot
          # would let a web-UI app install appear to work, and a missing vhost
          # would serve the base image's empty /var/www/html with no error.
          podman run --rm --entrypoint sh "$img" -c '
            set -eu
            test ! -e /usr/src/nextcloud
            test ! -e /entrypoint.sh
            test -f /var/www/nextcloud/version.php
            ! setpriv --reuid www-data --regid www-data --init-groups sh -c "test -w /var/www/nextcloud"
            grep -q "DocumentRoot /var/www/nextcloud" /etc/apache2/sites-enabled/nextcloud.conf
            grep -q "RewriteOptions Inherit" /etc/apache2/sites-enabled/nextcloud.conf
            apache2ctl configtest
          '

          # Every role resolves. `versions` runs the same version comparison
          # the web role gates on, against an uninstalled config, so it also
          # proves the role script parses.
          podman run --rm "$img" versions
          podman run --rm "$img" notify-push --version

      - name: Push
        if: steps.meta.outputs.push == 'true'
        run: podman push "${{ steps.meta.outputs.primary }}"

  manifest:
    name: ${{ matrix.image }} manifest
    needs: build
    runs-on: ubuntu-26.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless

    strategy:
      matrix:
        image: [nextcloud]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" \
            | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # One name that resolves on both architectures. sha-<commit> is the
      # immutable one to pin a deployment to; latest moves.
      - name: Join the per-architecture images
        id: join
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/${{ matrix.image }}"
          sha=$(git rev-parse --short HEAD)

          podman manifest create "$image:sha-$sha" \
            "docker://$image:sha-$sha-amd64" \
            "docker://$image:sha-$sha-arm64"
          podman manifest push --digestfile /tmp/digest "$image:sha-$sha" \
            "docker://$image:sha-$sha"
          podman manifest push "$image:sha-$sha" "docker://$image:latest"

          echo "digest=$image@$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Same two-signature split as build-bootc.yml, and the same reason: the
      # keyless one is the provenance record, the keyed one is what a policy
      # can actually require. Signing the manifest list covers both arches.
      - name: Sign (keyless)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" \
            | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "${{ steps.join.outputs.digest }}"

      - name: Sign (keyed)
        if: env.COSIGN_PRIVATE_KEY != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ steps.join.outputs.digest }}"
