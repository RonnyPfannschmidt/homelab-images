# Two tiers, split into two jobs because they cost very different amounts.
#
# `render` is seconds and gates every push: it covers the charts and the trust
# material, and the cluster tests skip themselves in it. `cluster` creates a
# real kind cluster, installs every chart into it and rehearses the Flux path
# that joins a public chart to private values - minutes, and affordable only
# because standard runners are free on a public repository.

name: checks

on:
  push:
    branches:
      - main
    paths:
      - olares-apps/**
      - trust/**
      - testing/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/charts.yml
  pull_request:
    paths:
      - olares-apps/**
      - trust/**
      - testing/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/charts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: render, validate, check trust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install kubeconform
        run: |
          version=v0.8.0
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      # The whole suite: without KIND_TESTS the cluster tests skip themselves,
      # so this stays seconds while covering anything added later.
      - run: uv run pytest testing/ -v

  cluster:
    name: install on kind
    runs-on: ubuntu-24.04
    # Not gated on `render`: a chart that fails to lint will fail here too, and
    # running them in parallel puts both answers in front of you at once.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Flux tier pins a GitRepository to the commit under test and
          # checks it is reachable on a remote, which needs more than a shallow
          # single-commit checkout to verify.
          fetch-depth: 0
          # The pull request head, not the merge commit GitHub synthesises for
          # the event. Flux clones this repository over plain HTTPS and asks
          # for one commit; a merge commit is reachable from no branch, so it
          # is not there to be fetched and the release never goes Ready. The
          # head is on a branch, and that is the commit the merge will carry.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          version: v0.33.0
          cluster_name: homelab-ci
          # The fixture creates and deletes its own cluster; this action is
          # here only to put the `kind` binary on PATH.
          install_only: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h /

      - name: Install charts and rehearse the Flux join
        env:
          KIND_TESTS: '1'
          # Flux fetches this repository over the network at the commit under
          # test, so it only works once that commit is on a remote - true for a
          # push, and for a pull request whose head is pushed to this repo, but
          # not for a fork. The fixture skips itself rather than failing when
          # the commit is not reachable.
          FLUX_TESTS: '1'
        run: uv run pytest testing/test_kind_deploy.py -v
