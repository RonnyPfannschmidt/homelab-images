# Build the voicebox app image from upstream's Dockerfile and hold its chart's
# pin to it.
#
# NOT REPRODUCIBLE, unlike build-routerimages.yml: upstream's Dockerfile
# resolves apt and pip at build time, so there is no digest to know before the
# push and nothing to build twice. The chart pins the tag apps/voicebox/build.sh
# derives from the upstream version and commit, and this workflow fails when
# values.yaml pins anything else. Moving upstream means editing build.sh and
# values.yaml together.

name: voicebox

on:
  push:
    branches:
      - main
    paths:
      - apps/voicebox/**
      - olares-apps/voicebox/values.yaml
      - .github/workflows/build-voicebox.yml
  pull_request:
    paths:
      - apps/voicebox/**
      - olares-apps/voicebox/values.yaml
      - .github/workflows/build-voicebox.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voicebox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, smoke, check the pin
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the tag and the pin
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/voicebox"
          tag=$(apps/voicebox/build.sh --print-tag)
          pinned=$(sed -n 's/^image: //p' olares-apps/voicebox/values.yaml)
          {
            echo "image=$image"
            echo "tag=$tag"
            echo "pinned=$pinned"
          } >> "$GITHUB_OUTPUT"

      - name: values.yaml pins this build
        run: |
          want="${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          pinned="${{ steps.meta.outputs.pinned }}"
          if [ "$want" != "$pinned" ]; then
            echo "::error file=olares-apps/voicebox/values.yaml::pins ${pinned:-nothing}, build.sh builds $want"
            exit 1
          fi

      # CUDA torch and its nvidia-* wheels make a ~10 GB image, built in
      # stages; the runner's preinstalled toolchains are what is in the way.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build
        run: apps/voicebox/build.sh localhost/voicebox

      # No GPU on the runner: this proves the server and web UI come up, not
      # that any engine loads.
      - name: Smoke test
        run: |
          podman run -d --name smoke -p 17493:17493 "localhost/voicebox:${{ steps.meta.outputs.tag }}"
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:17493/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:17493/health
          curl -fsS -o /dev/null http://127.0.0.1:17493/
          podman logs smoke
          podman rm -f smoke

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Push
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          podman push --digestfile /tmp/digest \
            "localhost/voicebox:${{ steps.meta.outputs.tag }}" \
            "docker://${{ steps.meta.outputs.pinned }}"
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"
          echo "pushed ${{ steps.meta.outputs.pinned }}@$(cat /tmp/digest)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The same two signatures as the other images: keyless for provenance,
      # keyed because that is what policy.json can require.
      - name: Sign (keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | cosign login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cosign sign --yes "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"

      - name: Sign (keyed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.COSIGN_PRIVATE_KEY != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}"
